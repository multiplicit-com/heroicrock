name: Refresh playlist and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest videos from the playlist RSS feed
        run: node scripts/update-videos.mjs
        continue-on-error: true # a feed hiccup should never break the site

      - name: Commit videos.json if it changed
        run: |
          if ! git diff --quiet -- videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh playlist videos" -- videos.json
            git push
          fi

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css app.js videos.json CNAME .nojekyll assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the live site responds
        continue-on-error: true
        run: |
          sleep 20
          for url in "${{ steps.deployment.outputs.page_url }}" https://heroicrock.com/ https://www.heroicrock.com/; do
            code=$(curl -sL -o /tmp/page.html -w '%{http_code}' "$url" || echo fail)
            echo "$url -> $code, title: $(grep -o '<title>[^<]*' /tmp/page.html | head -1)"
          done
