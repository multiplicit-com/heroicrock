name: Diagnose DNS and redirects

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for h in heroicrock.com www.heroicrock.com; do
            echo "== $h"; dig +short A $h; dig +short AAAA $h; dig +short CNAME $h; dig +short NS heroicrock.com
          done
      - name: Redirect chains
        run: |
          for u in http://heroicrock.com/ https://heroicrock.com/ http://www.heroicrock.com/ https://www.heroicrock.com/; do
            echo "== $u"
            curl -sS -o /dev/null --max-redirs 6 -L -w '%{http_code} final=%{url_effective} redirects=%{num_redirects}\n' "$u" || true
            curl -sSI --max-time 10 "$u" | grep -iE '^(HTTP|location|server|cf-ray)' || true
          done
